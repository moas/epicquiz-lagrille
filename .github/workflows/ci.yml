    if: >-
      github.event_name == 'push' &&
      (needs.changes.outputs.monitor == 'true' || startsWith(github.ref, 'refs/tags/monitor-v')) &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/monitor-v'))
