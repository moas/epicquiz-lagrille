name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      manager: ${{ steps.filter.outputs.manager }}
      monitor: ${{ steps.filter.outputs.monitor }}
      operator: ${{ steps.filter.outputs.operator }}
      player: ${{ steps.filter.outputs.player }}
      presenter: ${{ steps.filter.outputs.presenter }}
      tv: ${{ steps.filter.outputs.tv }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - '.github/workflows/ci.yml'
            manager:
              - 'apps/manager/**'
              - '.github/workflows/ci.yml'
            monitor:
              - 'apps/monitor/**'
              - '.github/workflows/ci.yml'
            operator:
              - 'apps/operator/**'
              - '.github/workflows/ci.yml'
            player:
              - 'apps/player/**'
              - '.github/workflows/ci.yml'
            presenter:
              - 'apps/presenter/**'
              - '.github/workflows/ci.yml'
            tv:
              - 'apps/tv/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' ||
      startsWith(github.ref, 'refs/tags/backend-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: epicquiz
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d epicquiz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/epicquiz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Check migrations
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: uv run pytest

  manager:
    needs: changes
    if: >-
      needs.changes.outputs.manager == 'true' ||
      startsWith(github.ref, 'refs/tags/manager-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/manager/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check Svelte and TypeScript
        run: npm run check
      - name: Build manager
        run: npm run build

  monitor:
    needs: changes
    if: >-
      needs.changes.outputs.monitor == 'true' ||
      startsWith(github.ref, 'refs/tags/monitor-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/monitor/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check Svelte and TypeScript
        run: npm run check
      - name: Build monitor
        run: npm run build

  operator:
    needs: changes
    if: >-
      needs.changes.outputs.operator == 'true' ||
      startsWith(github.ref, 'refs/tags/operator-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/operator/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check Svelte and TypeScript
        run: npm run check
      - name: Build operator
        run: npm run build

  player:
    needs: changes
    if: >-
      needs.changes.outputs.player == 'true' ||
      startsWith(github.ref, 'refs/tags/player-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/player/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check Svelte and TypeScript
        run: npm run check
      - name: Build player
        run: npm run build

  presenter:
    needs: changes
    if: >-
      needs.changes.outputs.presenter == 'true' ||
      startsWith(github.ref, 'refs/tags/presenter-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/presenter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/presenter/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check Svelte and TypeScript
        run: npm run check
      - name: Build presenter
        run: npm run build

  tv:
    needs: changes
    if: >-
      needs.changes.outputs.tv == 'true' ||
      startsWith(github.ref, 'refs/tags/tv-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/tv/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check Svelte and TypeScript
        run: npm run check
      - name: Build tv
        run: npm run build

  publish-backend:
    needs: [changes, backend]
    if: >-
      github.event_name == 'push' &&
      (needs.changes.outputs.backend == 'true' || startsWith(github.ref, 'refs/tags/backend-v')) &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/backend-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.REGISTRY_ENDPOINT }}/lagrille/backend
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=backend-v(.*),group=1
            type=sha
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_ENDPOINT }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWD }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-manager:
    needs: [changes, manager]
    if: >-
      github.event_name == 'push' &&
      (needs.changes.outputs.manager == 'true' || startsWith(github.ref, 'refs/tags/manager-v')) &&
